<div class="c-mainmenu-win11 ui--bg-blur ui--shadow js-mainmenu js-mainmenu-render"
    data-close-when-shutdown-open="true">
    <div class="c-mainmenu-win11__wrapper">
        <div class="c-mainmenu-win11__search">
            <svg>
                <use xlink:href="#taskbar-search"></use>
            </svg>
            <input type="text" placeholder="Поиск приложений, параметров и документов">
        </div>
        <div class="c-mainmenu-win11__title-group">
            <div class="c-mainmenu-win11__title">Закрепленные</div>
            <!-- <div class="c-mainmenu-win11__title-btn">
                <div class="c-mainmenu-win11__title-btn__label">Все приложения</div>
                <svg>
                    <use xlink:href="#mainmenu-arrow"></use>
                </svg>
            </div> -->
        </div>
        <div class="c-mainmenu-win11__programs">
            <div class="c-mainmenu-win11__programs__wrapper">

                {{#programs.rows}}
                <div class="c-mainmenu-win11__programs__item js-program-open" data-program-name="{{name}}">
                    <div class="c-mainmenu-win11__programs__item__icon">
                        {{{iconData}}}
                    </div>
                    <div class="c-mainmenu-win11__programs__item__name">{{title}}</div>
                </div>
                {{/programs.rows}}

            </div>
        </div>
    </div>
    <div class="c-mainmenu-win11__footer">
        <div class="c-mainmenu-win11__footer__wrapper">
            <div class="c-mainmenu-win11__profile">
                <svg>
                    <use xlink:href="#profile"></use>
                </svg>
                <div class="c-mainmenu-win11__profile__name js-mainmenu-name">{{name}}</div>
            </div>
            <div class="c-mainmenu-win11__shutdown" data-by-outside-click="false">
                <div class="c-mainmenu-win11__shutdown__icon js-mainmenu-shutdown-toggle">
                    <svg>
                        <use xlink:href="#shutdown"></use>
                    </svg>
                </div>
                <div class="c-mainmenu-win11__shutdown__menu ui--bg-blur ui--shadow js-mainmenu-shutdown"
                    data-closed="true" data-close-by-outside-click="true">
                    <div class="c-mainmenu-win11__shutdown__menu__wrapper">
                        <div class="c-mainmenu-win11__shutdown__items">
                            <div class="c-mainmenu-win11__shutdown__item js-app-save">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg>
                                        <use xlink:href="#save"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Сохранить</div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-load">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg class="c-mainmenu-win11__shutdown__item__icon--fix">
                                        <use xlink:href="#load"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Загрузить последнее сохранение
                                </div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-lock">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg class="c-mainmenu-win11__shutdown__item__icon--fix">
                                        <use xlink:href="#lock"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Блокировка</div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-save-and-shutdown">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg class="c-mainmenu-win11__shutdown__item__icon--fix">
                                        <use xlink:href="#shutdown"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Сохранить и завершить работу</div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-shutdown">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg class="c-mainmenu-win11__shutdown__item__icon--fix">
                                        <use xlink:href="#shutdown"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Завершить работу</div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-save-and-restart">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg>
                                        <use xlink:href="#restart"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Сохранить и перезагрузиться</div>
                            </div>
                            <div class="c-mainmenu-win11__shutdown__item js-app-restart">
                                <div class="c-mainmenu-win11__shutdown__item__icon">
                                    <svg>
                                        <use xlink:href="#restart"></use>
                                    </svg>
                                </div>
                                <div class="c-mainmenu-win11__shutdown__item__title">Перезагрузиться</div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    </divclass=>
